name: Submodule Checks

on:
  pull_request:
    paths:
      - .gitmodules
      - agent/**
      - games/**
      - lib/providers/**
  push:
    branches:
      - master
      - main
    paths:
      - .gitmodules
      - agent/**
      - games/**
      - lib/providers/**

permissions:
  contents: read

jobs:
  verify-submodules:
    name: Verify Submodules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
          persist-credentials: false
          submodules: recursive

      - name: Validate submodule state
        run: git submodule status --recursive

  gsa-checks:
    name: GSA checks from GSM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
          persist-credentials: false
          submodules: recursive

      - name: Detect GSA package
        id: detect_gsa
        shell: bash
        run: |
          if [ -f "agent/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip when GSA is missing
        if: ${{ steps.detect_gsa.outputs.exists != 'true' }}
        run: echo "agent/package.json not found, skipping GSA checks."

      - name: Setup Bun
        if: ${{ steps.detect_gsa.outputs.exists == 'true' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install GSA dependencies
        if: ${{ steps.detect_gsa.outputs.exists == 'true' }}
        working-directory: agent
        run: bun install --frozen-lockfile

      - name: Run GSA lint
        if: ${{ steps.detect_gsa.outputs.exists == 'true' }}
        working-directory: agent
        run: bun run lint

      - name: Run GSA type check
        if: ${{ steps.detect_gsa.outputs.exists == 'true' }}
        working-directory: agent
        run: bun run types

      - name: Run GSA build
        if: ${{ steps.detect_gsa.outputs.exists == 'true' }}
        working-directory: agent
        run: bun run build
